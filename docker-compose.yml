services:
  postgres:
    image: postgres:16-alpine
    container_name: tasklist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasklist
    ports:
      - "5433:5432"
    volumes:
      - tasklist-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tasklist-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - tasklist-redis-data:/data

volumes:
  tasklist-postgres-data:
  tasklist-redis-data:
